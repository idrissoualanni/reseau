input AddProjectReactionInput {
  projectId: ID!
  type: ProjectReactionType!
}

input CreateCommentInput {
  body: String!
  parentId: String
  postId: String!
}

input CreatePostInput {
  body: String!
  imageKey: String
}

input CreateProjectCommentInput {
  body: String!
  parentId: ID
  projectId: ID!
}

input CreateProjectInput {
  body: String!
  coverKey: String
  skillSlugs: [String!]
  title: String!
  type: ProjectType
}

input CreateProjectUpdateInput {
  body: String
  imageKey: String
  projectId: ID!
}

scalar DateTime

input DeleteProjectUpdateInput {
  id: ID!
}

input FollowProjectInput {
  projectId: ID!
}

type Mutation {
  addComment(input: CreateCommentInput!): PostComment
  addProjectReaction(input: AddProjectReactionInput!): ProjectReaction
  createPost(input: CreatePostInput!): Post
  createProject(input: CreateProjectInput!): Project
  createProjectComment(input: CreateProjectCommentInput!): ProjectComment
  createProjectUpdate(input: CreateProjectUpdateInput!): ProjectUpdate
  deleteComment(id: ID!): Boolean
  deletePost(id: ID!): Boolean
  deleteProject(id: ID!): Boolean
  deleteProjectComment(id: ID!): Boolean
  deleteProjectUpdate(input: DeleteProjectUpdateInput!): Boolean
  followProject(input: FollowProjectInput!): Boolean
  publishProject(coverKey: String, id: ID!): Project
  removeProjectReaction(projectId: ID!, type: ProjectReactionType!): Boolean
  togglePostLike(id: ID!): PostLikePayload
  unfollowProject(projectId: ID!): Boolean
  unpublishProject(id: ID!): Project
  updatePost(id: ID!, input: UpdatePostInput!): Post
  updateProject(id: ID!, input: UpdateProjectInput!): Project
}

"""État de pagination par curseur."""
type PageInfo {
  endCursor: String
  hasNextPage: Boolean
}

"""Post (activité) d'un membre."""
type Post {
  author: ProfileSummary
  body: String
  comments: [PostComment!]
  createdAt: DateTime

  """Vrai si le membre connecté a aimé ce post."""
  hasLiked: Boolean
  id: ID

  """URL publique de l'image du post, quand elle existe."""
  imageUrl: String

  """Nombre de j'aime sur le post."""
  likeCount: Int
  updatedAt: DateTime
}

"""Commentaire ou réponse d'un post (F11)."""
type PostComment {
  author: ProfileSummary
  body: String
  createdAt: DateTime
  id: ID
  replies: [PostComment!]
}

type PostConnection {
  edges: [PostEdge!]
  pageInfo: PageInfo
}

type PostEdge {
  cursor: String
  node: Post
}

type PostLikePayload {
  hasLiked: Boolean
  likeCount: Int
  postId: ID
}

"""Résumé public d'un membre."""
type ProfileSummary {
  avatarUrl: String
  displayName: String
  id: ID
  username: String
}

"""Projet d'un membre."""
type Project {
  author: ProfileSummary
  body: String
  comments(after: String, first: Int): ProjectCommentConnection
  coverUrl: String
  createdAt: DateTime
  followerCount: Int
  followers(after: String, first: Int): ProjectFollowerConnection
  id: ID
  isFollowed: Boolean
  publishedAt: DateTime
  reactions: [ProjectReaction!]
  skills: [Skill!]
  status: ProjectStatus
  title: String
  type: ProjectType
  updateCount: Int
  updatedAt: DateTime
  updates(after: String, first: Int): ProjectUpdateConnection
}

type ProjectComment {
  author: ProfileSummary
  body: String
  createdAt: DateTime
  depth: Int
  id: ID
  replies: [ProjectComment!]
  updatedAt: DateTime
}

type ProjectCommentConnection {
  edges: [ProjectCommentEdge!]
  pageInfo: PageInfo
}

type ProjectCommentEdge {
  cursor: String
  node: ProjectComment
}

type ProjectConnection {
  edges: [ProjectEdge!]
  pageInfo: PageInfo
}

type ProjectEdge {
  cursor: String
  node: Project
}

type ProjectFollower {
  createdAt: DateTime
  profile: ProfileSummary
}

type ProjectFollowerConnection {
  edges: [ProjectFollowerEdge!]
  pageInfo: PageInfo
}

type ProjectFollowerEdge {
  cursor: String
  node: ProjectFollower
}

type ProjectReaction {
  count: Int
  hasReacted: Boolean
  type: ProjectReactionType
}

enum ProjectReactionType {
  celebrate
  curious
  insight
  like
}

enum ProjectStatus {
  draft
  published
}

enum ProjectType {
  coursework
  open_source
  personal
  research
  team
}

type ProjectUpdate {
  author: ProfileSummary
  body: String
  createdAt: DateTime
  id: ID
  imageUrl: String
  updatedAt: DateTime
}

type ProjectUpdateConnection {
  edges: [ProjectUpdateEdge!]
  pageInfo: PageInfo
}

type ProjectUpdateEdge {
  cursor: String
  node: ProjectUpdate
}

type Query {
  myProjects(after: String, first: Int): ProjectConnection
  post(id: ID!): Post
  posts(after: String, first: Int): PostConnection
  project(id: ID!): Project
  projects(after: String, authorUsername: String, first: Int, skillSlug: String): ProjectConnection
  projectsV15(after: String, authorUsername: String, first: Int, projectTypes: [ProjectType!], search: String, skillSlugs: [String!]): ProjectConnection
}

"""Compétence du référentiel."""
type Skill {
  id: ID
  name: String
  slug: String
}

input UpdatePostInput {
  body: String!
  imageKey: String
}

input UpdateProjectInput {
  body: String
  coverKey: String
  skillSlugs: [String!]
  title: String
  type: ProjectType
}
