# Blueprint Render — projet "reseau". Valider : render blueprints validate
# État réel (vérifié MCP, 2026-10-08) : stack Next.js racine (npm) ;
# base sur Neon (pas de Postgres Render) ; KV reseau-dev existant (WebRTC V2) ;
# route /api/health à créer avant déploiement.
projects:
  - name: reseau
    environments:
      - name: dev
        services:
          - type: web
            name: reseau-dev
            runtime: node
            repo: https://github.com/idrissoualanni/reseau
            branch: dev          # branche `dev` à créer (workflow : PR dev → main)
            rootDir: .
            buildCommand: npm ci && npm run build
            startCommand: npm start
            healthCheckPath: /api/health
            autoDeployTrigger: commit
            envVars:
              - key: NODE_ENV
                value: production
              - key: NEXT_PUBLIC_APP_URL
                value: https://reseau-web-dev.onrender.com
              - key: NEON_BRANCH
                value: dev
              # Secrets : dashboard (sync: false), jamais en clair ici
              - key: DATABASE_URL
                sync: false
              - key: DATABASE_URL_UNPOOLED
                sync: false
              - key: NEON_AUTH_BASE_URL
                sync: false
              - key: NEON_AUTH_COOKIE_SECRET
                sync: false
              - key: NEON_AUTH_JWKS_URL
                sync: false
              - key: AUTH_SECRET
                sync: false
              - key: STORAGE_ACCESS_KEY_ID
                sync: false
              - key: STORAGE_SECRET_ACCESS_KEY
                sync: false
              - key: STORAGE_BUCKET
                sync: false
              - key: STORAGE_ENDPOINT
                sync: false
              - key: STORAGE_PUBLIC_BASE_URL
                sync: false
              - key: TURNSTILE_SECRET_KEY
                sync: false
      - name: production
        services:
          - type: web
            name: reseau-prod
            runtime: node
            repo: https://github.com/idrissoualanni/reseau
            branch: main
            rootDir: .
            buildCommand: npm ci && npm run build
            startCommand: npm start
            healthCheckPath: /api/health
            autoDeployTrigger: commit
            envVars:
              - key: NODE_ENV
                value: production
              - key: NEXT_PUBLIC_APP_URL
                value: https://reseau-web-prod.onrender.com
              - key: NEON_BRANCH
                value: main
              # Secrets : dashboard (sync: false), jamais en clair ici
              - key: DATABASE_URL
                sync: false
              - key: DATABASE_URL_UNPOOLED
                sync: false
              - key: NEON_AUTH_BASE_URL
                sync: false
              - key: NEON_AUTH_COOKIE_SECRET
                sync: false
              - key: NEON_AUTH_JWKS_URL
                sync: false
              - key: AUTH_SECRET
                sync: false
              - key: STORAGE_ACCESS_KEY_ID
                sync: false
              - key: STORAGE_SECRET_ACCESS_KEY
                sync: false
              - key: STORAGE_BUCKET
                sync: false
              - key: STORAGE_ENDPOINT
                sync: false
              - key: STORAGE_PUBLIC_BASE_URL
                sync: false
              - key: TURNSTILE_SECRET_KEY
                sync: false