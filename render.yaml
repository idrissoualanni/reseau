# Blueprint Render — projet "reseau". Valider : render blueprints validate
# État MCP (2026-10-10) : stack Next.js racine (npm) ; base Neon (branche dev) ;
# pas de Postgres Render ; service web dev `reseau` (srv-db4ek92jnfac73b4uij0,
# https://reseau-3tuk.onrender.com, région frankfurt) ; Key-Value pour WebRTC V2.
# Voir docs/deploiement.md pour le workflow PR dev → main.
projects:
  - name: reseau
    environments:
      - name: dev
        services:
          - type: web
            name: reseau
            runtime: node
            repo: https://github.com/idrissoualanni/reseau
            branch: dev          # branche `dev` (workflow : PR dev → main)
            rootDir: .
            buildCommand: npm ci && npm run build
            startCommand: npm start
            healthCheckPath: /api/health
            autoDeployTrigger: commit
            envVars:
              - key: NODE_ENV
                value: development
              - key: NEXT_PUBLIC_APP_URL
                fromService: [{"name": "reseau", "property": "publicUrl"}]
              - key: NEON_BRANCH
                value: dev
              # Secrets — jamais en clair, gérés via Dashboard Render (sync: false)
              - key: DATABASE_URL
                sync: false
              - key: DATABASE_URL_UNPOOLED
                sync: false
              - key: NEON_AUTH_BASE_URL
                sync: false
              - key: NEON_AUTH_COOKIE_SECRET
                sync: false
              - key: NEON_AUTH_JWKS_URL
                sync: false
              - key: AUTH_SECRET
                sync: false
              # Stockage Neon Object Storage (buckets `post`, `projet`, `profile`)
              - key: AWS_ACCESS_KEY_ID
                sync: false
              - key: AWS_SECRET_ACCESS_KEY
                sync: false
              - key: AWS_REGION
                sync: false
              - key: AWS_ENDPOINT_URL_S3
                sync: false
              # Turnstile — clé secrète gérée dashboard (sync: false), désactivé V1
              - key: TURNSTILE_SECRET_KEY
                sync: false
              # TURN WebRTC — à renseigner via MCP Render ou .env.local (Lot 3+)
              - key: TURN_URL
                sync: false
              - key: TURN_USERNAME
                sync: false
              - key: TURN_CREDENTIAL
                sync: false
      - name: production
        services:
          - type: web
            name: reseau-prod
            runtime: node
            repo: https://github.com/idrissoualanni/reseau
            branch: main
            rootDir: .
            buildCommand: npm ci && npm run build
            startCommand: npm start
            healthCheckPath: /api/health
            autoDeployTrigger: commit
            envVars:
              - key: NODE_ENV
                value: production
              - key: NEXT_PUBLIC_APP_URL
                value: https://reseau-web-prod.onrender.com
              - key: NEON_BRANCH
                value: main
              # Secrets : dashboard (sync: false), jamais en clair ici
              - key: DATABASE_URL
                sync: false
              - key: DATABASE_URL_UNPOOLED
                sync: false
              - key: NEON_AUTH_BASE_URL
                sync: false
              - key: NEON_AUTH_COOKIE_SECRET
                sync: false
              - key: NEON_AUTH_JWKS_URL
                sync: false
              - key: AUTH_SECRET
                sync: false
              - key: AWS_ACCESS_KEY_ID
                sync: false
              - key: AWS_SECRET_ACCESS_KEY
                sync: false
              - key: AWS_REGION
                sync: false
              - key: AWS_ENDPOINT_URL_S3
                sync: false
              - key: TURNSTILE_SECRET_KEY
                sync: false