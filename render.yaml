# Blueprint Render — projet "reseau". Valider : render blueprints validate
# État MCP (2026-10-09) : stack Next.js racine (npm) ; base Neon (dev branch) ;
# pas de Postgres Render ; Key-Value reseau-dev pour WebRTC V2 / stockage avatars.
# Voir docs/deploiement.md pour le workflow PR dev → main.
projects:
  - name: reseau
    environments:
      - name: dev
        services:
          - type: web
            name: reseau-dev
            runtime: node
            repo: https://github.com/idrissoualanni/reseau
            branch: dev          # branche `dev` à créer (workflow : PR dev → main)
            rootDir: .
            buildCommand: npm ci && npm run build
            startCommand: npm start
            healthCheckPath: /api/health
            autoDeployTrigger: commit
            envVars:
              - key: NODE_ENV
                value: development
              - key: NEXT_PUBLIC_APP_URL
                fromService: [{"name": "reseau-dev", "property": "publicUrl"}]
              - key: NEON_BRANCH
                value: dev
              # Secrets — jamais en clair, gérés via Dashboard Render (sync: false)
              - key: DATABASE_URL
                sync: false
              - key: DATABASE_URL_UNPOOLED
                sync: false
              - key: NEON_AUTH_BASE_URL
                sync: false
              - key: NEON_AUTH_COOKIE_SECRET
                sync: false
              - key: NEON_AUTH_JWKS_URL
                sync: false
              - key: AUTH_SECRET
                sync: false
              # Stockage S3-compatible Neon Object Storage (variables lues côté code)
              - key: STORAGE_ACCESS_KEY_ID
                sync: false
              - key: STORAGE_SECRET_ACCESS_KEY
                sync: false
              - key: STORAGE_BUCKET
                sync: false
              - key: STORAGE_ENDPOINT
                sync: false
              - key: STORAGE_PUBLIC_BASE_URL
                sync: false
              # Turnstile — clé secrète gérée dashboard (sync: false), désactivé V1
              - key: TURNSTILE_SECRET_KEY
                sync: false
              # TURN WebRTC — à renseigner via MCP Render ou .env.local (Lot 3+)
              - key: TURN_URL
                sync: false
              - key: TURN_USERNAME
                sync: false
              - key: TURN_CREDENTIAL
                sync: false
      - name: production
        services:
          - type: web
            name: reseau-prod
            runtime: node
            repo: https://github.com/idrissoualanni/reseau
            branch: main
            rootDir: .
            buildCommand: npm ci && npm run build
            startCommand: npm start
            healthCheckPath: /api/health
            autoDeployTrigger: commit
            envVars:
              - key: NODE_ENV
                value: production
              - key: NEXT_PUBLIC_APP_URL
                value: https://reseau-web-prod.onrender.com
              - key: NEON_BRANCH
                value: main
              # Secrets : dashboard (sync: false), jamais en clair ici
              - key: DATABASE_URL
                sync: false
              - key: DATABASE_URL_UNPOOLED
                sync: false
              - key: NEON_AUTH_BASE_URL
                sync: false
              - key: NEON_AUTH_COOKIE_SECRET
                sync: false
              - key: NEON_AUTH_JWKS_URL
                sync: false
              - key: AUTH_SECRET
                sync: false
              - key: STORAGE_ACCESS_KEY_ID
                sync: false
              - key: STORAGE_SECRET_ACCESS_KEY
                sync: false
              - key: STORAGE_BUCKET
                sync: false
              - key: STORAGE_ENDPOINT
                sync: false
              - key: STORAGE_PUBLIC_BASE_URL
                sync: false
              - key: TURNSTILE_SECRET_KEY
                sync: false